name: deploy-web

# STAGED: production deploy from CI, so prod HTML is a pure function of the
# committed tree and the keeper's laptop leaves the trust chain (2026-07-02
# full-analysis finding: laptop-built prod HTML has no provenance against git).
#
# Activation requires the VERCEL_TOKEN secret (Vercel account token) plus
# VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets. Until then this workflow is
# manual-only and fails fast with a clear message instead of deploying.

# ACTIVATED 2026-07-11: VERCEL_* secrets set; prod HTML is now a pure function of
# the committed tree (map#16 closed). deploy.sh remains the manual fallback.

# PUBLICATION CHAIN REPAIRED 2026-08-10. The `push` trigger below can never fire
# for the weekly snapshot: GitHub deliberately does not start workflows for
# commits pushed with the default GITHUB_TOKEN, and weekly-snapshot pushes with
# exactly that token. So every automated snapshot since deploys were activated
# landed in git and stopped there, and prod only moved when a human happened to
# push web/** afterwards. Evidence: five weekly-snapshot runs between 07-11 and
# 08-08, two deploy-web runs in the same window, both from human pushes; on
# 2026-08-10 prod still served the 08-01 snapshot (135 systems) while main held
# 08-08 (143), so the first census activation tranche was invisible for a week.
# The `workflow_run` trigger closes that gap, and the post-deploy step below
# turns "prod serves the snapshot main holds" into a checked fact rather than an
# assumption. Freshness is watched independently every 30 min by
# scripts/freshness-check.mjs (liveness-check.yml).
on:
  workflow_dispatch:
    inputs:
      release_date:
        description: "Snapshot YYYY-MM-DD to verify (empty = latest in the deployed tree)"
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    # Everything the build reads, kept in step with web-ci's input set. The old
    # list omitted etl/ and taxonomy/, so an activation tranche or a fresh owner
    # classification changed what the site should say and published nothing.
    paths: ['web/**', 'data/**', 'etl/**', 'taxonomy/**', 'redirects.yaml']
  workflow_run:
    workflows: ["weekly-snapshot"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false
  queue: max               # Keep pending production publications instead of replacing them.

jobs:
  deploy:
    permissions:
      contents: read
      statuses: write
    runs-on: ubuntu-latest
    # A failed or cancelled producer must not publish a half-written snapshot.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       startsWith(github.event.workflow_run.display_title, 'weekly release ') &&
       !endsWith(github.event.workflow_run.display_title, 'resolve-date'))
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # workflow_run checks out the SHA the PRODUCER started from, which is
          # the commit BEFORE the snapshot it just wrote. Deploying that would
          # republish last week verbatim and look like a successful publication.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Record the actual checkout SHA
        id: checkout
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "$SHA" > "$RUNNER_TEMP/release-checkout.txt"

      - name: Expose the actual checkout to release sensors
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-checkout-${{ github.run_attempt }}-${{ steps.checkout.outputs.sha }}
          path: ${{ runner.temp }}/release-checkout.txt
          if-no-files-found: error

      - name: Resolve the snapshot commit in this tree
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DATE: ${{ inputs.release_date }}
          PRODUCER_TITLE: ${{ github.event.workflow_run.display_title }}
        run: |
          DATE="$INPUT_DATE"
          if [ "$GITHUB_EVENT_NAME" = workflow_run ]; then DATE="${PRODUCER_TITLE#weekly release }"; fi
          node scripts/release-status.mjs prepare "$DATE"

      - name: Require Vercel secrets
        id: secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets are not set."
            echo "Set them in repo settings to activate CI deploys (see deploy.sh fast-follow note)."
            exit 1
          fi

      - id: node
        name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Build the static site from the committed tree
        id: build
        # Analytics keys are client-side publishable IDs (ANALYTICS.md), kept as
        # repo variables, not secrets. Without them Analytics.astro renders
        # nothing, which is how prod ran from the CI switch (07-11) to 09-23 with
        # no GA4 / PostHog / Clarity at all: the keys lived only in web/.env on
        # the keeper's laptop.
        env:
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_CLARITY_ID: ${{ vars.PUBLIC_CLARITY_ID }}
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
        run: |
          cd web
          npm ci
          npm run verify

      - name: Deploy prebuilt dist to Vercel production
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd web
          cp vercel.json dist/vercel.json
          mkdir -p dist/.vercel
          printf '{"projectId":"%s","orgId":"%s"}\n' "$VERCEL_PROJECT_ID" "$VERCEL_ORG_ID" > dist/.vercel/project.json
          cd dist
          # --archive=tgz: Vercel rejects CLI uploads above 15,000 files ("files should NOT have more than
          # 15000 items"; probed 2026-09-24 with 20,002 files). The 2026-09-26 snapshot grows the site from
          # ~10k to ~290k files; one archive upload keeps the deploy inside the limit (same probe passed).
          node ../../scripts/vercel-deploy.mjs

      - name: Verify prod serves the snapshot this tree holds
        id: receipt
        # A deploy whose CLI exited 0 while the live host keeps serving last
        # week's snapshot is exactly the silent failure this chain exists to
        # prevent, so publication is confirmed against evidaxis.org itself.
        env:
          RELEASE_DATE: ${{ steps.release.outputs.date }}
        run: node scripts/deploy-receipt.mjs

      - name: Record deployment receipt or failed step
        if: ${{ always() && steps.release.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DATE: ${{ steps.release.outputs.date }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
          RELEASE_STEPS: ${{ toJSON(steps) }}
        run: node scripts/release-status.mjs record deployed
