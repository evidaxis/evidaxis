name: weekly-snapshot
run-name: weekly ${{ inputs.mode || 'release' }} ${{ inputs.release_date || 'resolve-date' }}

# Evidaxis heartbeat — laptop-independent. Runs on GitHub's servers, not the keeper's machine.
# Interim (pre-spine): re-snapshots the current set with the v2 collector, then re-classes the
# output PROVISIONAL (PRE_INGEST_CONTRACT §1.2) so it never poisons the real v3 t=0 baseline.
# Re-point at the v3 survey refresh once the thin spine (S1/PR1) lands.
#
# Hardening (2026-07-02): shared `data-commits` concurrency group + rebase-retry push
# (Saturday race vs t2-daily), completeness gate (no entity leaves the universe silently),
# history-ledger check, pinned actions, no persisted credentials. A failed run
# is surfaced by GitHub's native workflow-failure email (no extra alert issue).

on:
  schedule:
    - cron: "17 6 * * 6"   # Saturdays 06:17 UTC, weekly
  workflow_dispatch:        # allow manual run from the Actions tab
    inputs:
      release_date:
        description: "Saturday YYYY-MM-DD (empty = last Saturday UTC); release cannot use a future date."
        required: false
        default: ""
        type: string
      mode:
        description: "Release or full rehearsal without publication"
        required: false
        default: release
        type: choice
        options: [release, rehearsal]

permissions:
  contents: read
  actions: read

concurrency:
  group: weekly-${{ inputs.release_date || github.run_id }}
  cancel-in-progress: false
  queue: max               # Keep dated duplicates waiting for the archive guard.

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write       # The date resolver dispatches the same workflow with an explicit date.
    outputs:
      date: ${{ steps.guard.outputs.date }}
      mode: ${{ steps.guard.outputs.mode }}
      skip: ${{ steps.guard.outputs.skip }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false
      - name: Already exists guard and date resolution
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode || 'release' }}
          INPUT_DATE: ${{ inputs.release_date }}
        run: |
          if [ -z "$INPUT_DATE" ]; then
            python3 scripts/release_guard.py --route
          else
            python3 scripts/release_guard.py
          fi

  snapshot:
    needs: guard
    if: inputs.release_date != '' && needs.guard.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      statuses: write
    concurrency:
      group: data-commits
      cancel-in-progress: false
      queue: max           # Weekly must not evict a pending T2 write, including during rehearsal.
    env:
      SNAPSHOT_DATE: ${{ needs.guard.outputs.date }}
      MODE: ${{ needs.guard.outputs.mode }}
    # 5,939 systems (2026-09-26): GraphQL metadata + two /stats passes on the GitHub App
    # budget, with rate-limit waits, fit in ~3-4 h; 350 min keeps a margin under the 6 h cap.
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.ref_name }}  # Refresh the archive after waiting for the write queue.
          fetch-depth: 0   # m3 sanity confirmation uses first-add commit times
          persist-credentials: false   # push happens via explicit token URL in the commit step

      - name: Recheck already exists after waiting
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_DATE: ${{ needs.guard.outputs.date }}
        run: |
          python3 scripts/release_guard.py
          echo "EVX_RUN_STARTED=$(date -u +%s)" >> "$GITHUB_ENV"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: ${{ steps.guard.outputs.skip == 'false' }}
        with:
          python-version: "3.12"

      - name: Prefetch repository metadata over GraphQL (100 repositories per query)
        if: ${{ steps.guard.outputs.skip == 'false' }}
        # One aliased GraphQL query answers stars / created_at / database id / owner type
        # for 100 repositories, replacing ~12,000 REST `repos/{repo}` calls (collector +
        # owner classification). Cache lives in the runner temp dir, never in the repo.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLECT_APP_ID: ${{ secrets.COLLECT_APP_ID }}
          COLLECT_APP_KEY: ${{ secrets.COLLECT_APP_KEY }}
          EVX_GH_CACHE_DIR: ${{ runner.temp }}/evx-gh
          # A seed that is gone on GitHub (404/410/451) or whose name now resolves to another
          # repository id is retired here, before collection: removed from etl/seeds.json and
          # recorded in data/observations/<date>/seed-departures.json (committed with the
          # snapshot). Weekly churn in a 6,000-system universe must not cost the week
          # (2026-09-26, 10-03, 10-10 each stopped on it). Only more departures than the cap
          # (token or API trouble) fail the step. Rehearsal uses the same retirement
          # path in this disposable checkout; publication steps alone are disabled.
          EVX_ALLOW_DEAD_SEEDS: '0'
        run: python3 collectors/gh_graphql.py

      - name: Warm GitHub /stats caches (one request per repository)
        if: ${{ steps.guard.outputs.skip == 'false' }}
        # /stats/commit_activity answers 202 while GitHub computes; this pass fires the
        # computation for every repository and caches every 200 body. It does not run
        # the collector and writes nothing to the repository.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLECT_APP_ID: ${{ secrets.COLLECT_APP_ID }}
          COLLECT_APP_KEY: ${{ secrets.COLLECT_APP_KEY }}
          EVX_GH_CACHE_DIR: ${{ runner.temp }}/evx-gh
          EVX_PASS: warm
        run: python3 collectors/openalex_keyed_fetch.py

      - name: Collect snapshot (keyed OpenAlex; capture pass + completeness gate)
        if: ${{ steps.guard.outputs.skip == 'false' }}
        # Entrypoint is the fetch-layer wrapper (collectors/openalex_keyed_fetch.py):
        # the frozen etl/collect.py runs unmodified inside it, with the dead mailto
        # param replaced by api_key auth and HTTP 409 credit exhaustion failing LOUDLY.
        # Two collects: the first triggers GitHub to compute /stats/commit_activity
        # (which answers 202 while computing), the second picks up the now-warm caches,
        # minimizing transient drops. The completeness gate then RECORDS any residual
        # gaps in dropped.json (never silent) and fails ONLY on a structural fraction
        # (dead token / mass outage) — a handful of transient /stats 202s must not cost
        # the whole week's snapshot. Scoring semantics / m2 fingerprint untouched.
        # Since 2026-09-26 the warm pass is the step above; this capture pass serves the
        # cached 200s and requests the rest with 202 retries (2/4/8/16/30 s). GitHub rate
        # limits are waited out (sleep until reset, same request retried), not fatal.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # fallback only; the App token carries the run
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          COLLECT_APP_ID: ${{ secrets.COLLECT_APP_ID }}
          COLLECT_APP_KEY: ${{ secrets.COLLECT_APP_KEY }}
          EVX_GH_CACHE_DIR: ${{ runner.temp }}/evx-gh
          EVX_PASS: capture
        run: |
          python3 collectors/openalex_keyed_fetch.py
          python3 collectors/completeness_gate.py --date "$SNAPSHOT_DATE"

      - name: Re-class as PROVISIONAL (pre-spine, idempotent)
        if: ${{ steps.guard.outputs.skip == 'false' }}
        run: python3 etl/reclass_pre_spine.py

      - name: Map snapshot onto taxonomy v2 (frozen collect.py emits tax_1)
        if: ${{ steps.guard.outputs.skip == 'false' }}
        # collect.py is byte-frozen and emits the v1 taxonomy + tax_1 nodes.json; this
        # deterministic post-step remaps the fresh snapshot to the locked v2 (field/cohort)
        # and restores the canonical v2 nodes.json, so the heartbeat stays v2-consistent.
        run: python3 collectors/taxonomy_v2.py --date "$SNAPSHOT_DATE"

      - name: Refresh the owner-publication cache for newly seeded repositories
        if: ${{ steps.guard.outputs.skip == 'false' }}
        # The person-free guard fails CLOSED: the site refuses to render a card
        # whose owner is unclassified, which is correct and was also the reason
        # the whole build died once the first census tranche seeded ten repos
        # (2026-08-10: "repository publication classification is unavailable").
        # The collector regenerates etl/id_map.json here, so this is where the
        # cache has to keep up; a registry that grows weekly cannot depend on
        # someone remembering to run a classifier by hand.
        # Owner type / repo id / full name come from the GraphQL cache; REST only for misses.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COLLECT_APP_ID: ${{ secrets.COLLECT_APP_ID }}
          COLLECT_APP_KEY: ${{ secrets.COLLECT_APP_KEY }}
          EVX_GH_CACHE_DIR: ${{ runner.temp }}/evx-gh
        run: |
          python3 collectors/owner_classify.py
          python3 collectors/owner_classify.py --verify

      - name: Restore public redirects mirror (frozen collector writes a stale one)
        if: ${{ steps.guard.outputs.skip == 'false' }}
        # etl/collect.py is byte-frozen and re-emits the genesis redirects.yaml every
        # run; regenerate it from web/vercel.json (the config that actually executes)
        # so `git add -A` does not revert the maintained mirror. web-ci enforces 1:1.
        run: python3 collectors/gen_redirects.py

      - name: Score methodology m3 (forward from 2026-09-19)
        if: ${{ steps.guard.outputs.skip == 'false' }}
        # Reuse confirmed-clean weekly deps inputs without modifying frozen etl/.
        run: python3 collectors/score_m3.py --date "$SNAPSHOT_DATE"

      - name: Content-addressed snapshot_id (post-step; frozen collect.py seeds-only mint)
        if: ${{ steps.guard.outputs.skip == 'false' }}
        # collect.py mints snapshot_id from methodology + seed-manifest only, so two
        # days with the same seeds can share an id while payloads differ (ERRATA
        # 2026-07-10, f1f2495d518d). Rewrite to sha256(canonical payload)[:12] BEFORE
        # refresh_sums seals the bundle. Must run after taxonomy_v2 (mutates entities)
        # and before refresh_sums (mandatory FINAL content step).
        run: python3 collectors/snapshot_identity.py --date "$SNAPSHOT_DATE"

      - name: Refresh snapshot checksums (mandatory FINAL content step)
        if: ${{ steps.guard.outputs.skip == 'false' }}
        # collect.py writes SHA256SUMS, but reclass_pre_spine.py, taxonomy_v2.py, and
        # snapshot_identity.py mutate snapshot.json/manifest.json AFTER the sums are
        # written. Re-hash the bundle so published sums match published bytes
        # (see 2026-07-01 ERRATA.md). Nothing may mutate snapshot files after this step.
        run: |
          python3 collectors/refresh_sums.py --date "$SNAPSHOT_DATE"
          python3 collectors/refresh_sums.py --verify

      - name: History ledger must resolve (no phantom snapshot ids)
        if: ${{ steps.guard.outputs.skip == 'false' }}
        run: python3 collectors/history_ledger_check.py

      - name: Merkle-anchor the archive (integrity root + OpenTimestamps)
        if: ${{ steps.guard.outputs.skip == 'false' }}
        # Compact, un-forgeable witness that the WHOLE data/ archive existed as-is
        # at time T. Roots are APPEND-ONLY (timestamped files, chained via prev_root);
        # an integrity witness is never rewritten in place.
        run: |
          python3 collectors/merkle_root.py
          python3 collectors/merkle_root.py --verify
          if [ "$MODE" = "rehearsal" ]; then exit 0; fi
          pip install --quiet "opentimestamps-client==0.7.2" || echo "ots install failed; stamp skipped this run"
          FILE=$(ls data/integrity/archive-root-*.json | sort | tail -1)
          if [ -f "$FILE" ] && command -v ots >/dev/null 2>&1; then
            ots stamp "$FILE" || echo "ots stamp deferred (calendar unreachable)"
          fi

      - name: Check the HF publication projection
        if: ${{ steps.guard.outputs.skip == 'false' && (inputs.mode == 'rehearsal') }}
        run: python3 scripts/hf_upload_snapshot.py --date "$SNAPSHOT_DATE" --dry-run

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.guard.outputs.skip == 'false' && (inputs.mode == 'rehearsal') }}
        with:
          node-version: "22"

      - name: Verify the site against this rehearsal candidate
        if: ${{ steps.guard.outputs.skip == 'false' && (inputs.mode == 'rehearsal') }}
        env:
          EVIDAXIS_DATA_DIR: ${{ github.workspace }}/data
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_CLARITY_ID: ${{ vars.PUBLIC_CLARITY_ID }}
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
        run: |
          cd web
          npm ci
          npm run verify

      - name: Timing and request summary
        if: ${{ steps.guard.outputs.skip == 'false' && (always()) }}
        env:
          EVX_GH_CACHE_DIR: ${{ runner.temp }}/evx-gh
        run: |
          OUT="${{ runner.temp }}/evx-summary"
          mkdir -p "$OUT"
          cp "$EVX_GH_CACHE_DIR"/summary-*.json "$EVX_GH_CACHE_DIR"/warm-202.json "$OUT"/ 2>/dev/null || true
          NOW=$(date -u +%s)
          printf '{"snapshot_date":"%s","mode":"%s","started_epoch":%s,"finished_epoch":%s,"elapsed_min":%s}\n' \
            "$SNAPSHOT_DATE" "$MODE" "${EVX_RUN_STARTED:-0}" "$NOW" \
            "$(( (NOW - ${EVX_RUN_STARTED:-$NOW}) / 60 ))" > "$OUT/timing.json"
          cat "$OUT/timing.json"

      - name: Rehearsal report
        if: ${{ steps.guard.outputs.skip == 'false' && (always() && inputs.mode == 'rehearsal') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="${{ runner.temp }}/evx-summary"
          # Missing job metadata must still leave a red, incomplete report artifact.
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$OUT/jobs.json" || rm -f "$OUT/jobs.json"
          python3 scripts/rehearsal_report.py --date "$SNAPSHOT_DATE" --summary-dir "$OUT"

      - name: Pack the rehearsal candidate
        if: ${{ steps.guard.outputs.skip == 'false' && (always() && (inputs.mode == 'rehearsal' || failure())) }}
        run: |
          mkdir -p "${{ runner.temp }}/evx-candidate"
          if [ "$MODE" = "rehearsal" ]; then
            python3 scripts/rehearsal_drill.py pack --out "${{ runner.temp }}/evx-candidate"
          fi

      - name: Upload snapshot + summary (rehearsal, or any failed run)
        if: ${{ steps.guard.outputs.skip == 'false' && (always() && (inputs.mode == 'rehearsal' || failure())) }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: snapshot-${{ env.SNAPSHOT_DATE }}-${{ github.run_id }}
          path: |
            data/snapshots/${{ env.SNAPSHOT_DATE }}/
            ${{ runner.temp }}/evx-summary/
            ${{ runner.temp }}/evx-candidate/
          if-no-files-found: warn
          retention-days: 14

      - name: Commit snapshot if changed (rebase-retry against concurrent data pushes)
        id: commit
        if: ${{ steps.guard.outputs.skip == 'false' && (inputs.mode != 'rehearsal') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "Evidaxis"
          git config user.email "git@evidaxis.org"
          # Stage ALL pipeline outputs, not just data/: the frozen collector also writes
          # etl/id_map.json, taxonomy/nodes.json, entities/, relationships.tsv. Staging
          # only data/ left those unstaged — harmless while the universe was constant
          # (byte-identical), but on an expansion id_map.json changes, and an unstaged
          # file makes the rebase-retry fail ("cannot pull with rebase: unstaged changes").
          git add -A
          if git diff --cached --quiet; then
            echo "no snapshot change this week"
            exit 0
          fi
          git commit -m "snapshot: weekly heartbeat (provisional, automated)"
          for i in 1 2 3; do
            if git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main; then
              exit 0
            fi
            echo "push rejected (concurrent data commit?) - rebase and retry ($i/3)"
            git pull --rebase "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" main
          done
          echo "push failed after 3 rebase attempts"
          exit 1

      - name: Record captured snapshot on its commit
        id: captured
        if: ${{ steps.guard.outputs.skip == 'false' && (inputs.mode != 'rehearsal') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-status.mjs capture "$SNAPSHOT_DATE"

      - name: Mirror the dated snapshot to HF and verify public contents
        id: hf
        if: ${{ steps.guard.outputs.skip == 'false' && (inputs.mode != 'rehearsal') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then echo "::error::HF_TOKEN missing"; exit 1; fi
          # 2.2.0 was released on 2026-10-08 and used by the unpinned 2026-10-17 release.
          python -m pip install --quiet "huggingface_hub==2.2.0"
          python3 scripts/hf_upload_snapshot.py --date "$SNAPSHOT_DATE"

      - name: Record HF receipt or failed step
        if: ${{ always() && inputs.mode != 'rehearsal' && steps.captured.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_DATE: ${{ steps.captured.outputs.date }}
          RELEASE_SHA: ${{ steps.captured.outputs.sha }}
          RELEASE_STEPS: ${{ toJSON(steps) }}
        run: node scripts/release-status.mjs record hf

      - name: Ask Software Heritage to re-archive the repository
        # Independent of the HF mirror: still runs when that step failed.
        if: ${{ steps.guard.outputs.skip == 'false' && (always() && inputs.mode != 'rehearsal' && steps.commit.outcome == 'success') }}
        # Keeps an independent off-GitHub copy of the full git history current.
        run: |
          curl -fsS -X POST "https://archive.softwareheritage.org/api/1/origin/save/git/url/https://github.com/${GITHUB_REPOSITORY}/" \
            || echo "SWH save request deferred"

      - name: Tell the keeper the rehearsal failed
        if: ${{ failure() && inputs.mode == 'rehearsal' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_TG_CHAT_ID }}
        run: node scripts/rehearsal-alert.mjs
