name: archive-integrity

# Standing reproducibility check over the COMMITTED archive (renewal CP-6).
# The unit tests exercise freshly-generated tmp artifacts; this job asserts the
# published tree itself: every snapshot's SHA256SUMS matches its actual bytes,
# the taxonomy-v2 remap is idempotent on the committed snapshot, and the genesis
# snapshot remains byte-identical to the immutable Zenodo deposit copy.
#
# Deliberately NOT here: `merkle_root.py --verify` as a standing check. data/
# moves daily (t2 observations) while archive roots are recorded weekly, so a
# recompute-vs-latest-recorded comparison is only meaningful at record time —
# the weekly-snapshot workflow re-records the root as its final integrity step.

on:
  push:
    branches: [main]
    paths:
      - "data/**"
      - "collectors/**"
      - "methodology/**"
      - "etl/**"
      - "genesis-deposit/**"
      - ".github/workflows/archive-integrity.yml"
  schedule:
    - cron: "47 3 * * *"   # nightly 03:47 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        id: checkout
        with:
          fetch-depth: 0   # append-only guards diff the pushed range

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        id: setup_python
        with:
          python-version: "3.12"

      - name: Every snapshot's SHA256SUMS matches its actual bytes
        id: snapshot_checksums
        run: python3 collectors/refresh_sums.py --verify

      - name: Taxonomy v2 remap is idempotent on the committed snapshot
        id: taxonomy_remap
        run: python3 collectors/taxonomy_v2.py --verify

      - name: Methodology m3 matches committed inputs (activation-aware)
        id: methodology_inputs
        run: python3 collectors/score_m3.py --verify

      - name: History ledger resolves (no phantom snapshot ids)
        id: history_ledger
        run: python3 collectors/history_ledger_check.py

      - name: snapshot_id collisions are content-distinct or allowlisted
        id: snapshot_identity
        # Fail if two snapshot dirs share snapshot_id with different payload hashes,
        # unless the pair is listed in data/observations/errata_snapshot_id.json
        # (known pre-fix collision f1f2495d518d on 2026-07-03 / 2026-07-04).
        run: python3 collectors/snapshot_identity.py --check

      - name: Integrity witnesses are append-only (no in-place modification)
        id: append_only_witnesses
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: |
          MODIFIED=$(git diff --name-status "${{ github.event.before }}" "${{ github.sha }}" -- data/integrity/ | grep -E '^(M|D|R)' || true)
          if [ -n "$MODIFIED" ]; then
            echo "data/integrity/ files were modified/deleted/renamed (append-only violation):"
            echo "$MODIFIED"
            exit 1
          fi
          echo "integrity witnesses untouched or append-only in this push"

      - name: Universe expansion requires a discovery-frontier manifest
        id: universe_change
        # The candidate-pool denominator is un-backfillable: adding/removing a tracked
        # system without a paired dated frontier manifest repeats the 19->103 loss.
        # Trigger ONLY on an actual universe change (the tracked repository set differs),
        # NOT on cosmetic seeds.json edits (a meta note, a label) — those need no manifest.
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        # Removals may instead be declared in data/observations/<date>/seed-departures.json
        # (weekly preflight, collectors/gh_graphql.py). Sets are compared from both
        # revisions of seeds.json; deleted records do not count.
        run: python3 collectors/universe_change_check.py "${{ github.event.before }}" "${{ github.sha }}"

      - name: Genesis snapshot is byte-identical to the immutable deposit
        id: genesis_bytes
        run: |
          rc=0
          for f in SHA256SUMS snapshot.json manifest.json provenance.json archive-pointers.json; do
            if cmp -s "genesis-deposit/data/$f" "data/snapshots/2026-06-27/$f"; then
              echo "  $f: identical"
            else
              echo "  $f: BYTE-DIFF vs genesis deposit (I5 escalation trigger)"
              rc=1
            fi
          done
          exit $rc

      - name: Name the failed integrity steps
        if: failure()
        env:
          INTEGRITY_STEPS: ${{ toJSON(steps) }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        # Inline so checkout or Python setup failure can still be named.
        run: |
          node --input-type=module <<'JS'
          // No Telegram from CI (29.10.2026): the red run is the alarm and the keeper's
          // sentinel reads it. This step only names the failed steps in the log.
          const failed = Object.entries(JSON.parse(process.env.INTEGRITY_STEPS))
            .filter(([, step]) => step.outcome === 'failure').map(([id]) => id);
          console.log(`::error title=archive-integrity failed::Failed steps: ${failed.join(', ')} ${process.env.RUN_URL}`);
          JS
