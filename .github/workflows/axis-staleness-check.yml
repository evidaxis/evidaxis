name: Axis capture staleness check
# Fail-safe sensor for the weekly v2h.1 capture ritual (keeper request 2026-07-21:
# "I will forget — wire it into rituals"). Pure git-based fact sensor (external-seam
# doctrine): if the newest committed deps_v2h1 capture manifest is older than the
# threshold, the run goes red. SILENT while the weekly ritual runs on time — this is a
# dead-week alarm, not a notification channel (Reddit-watcher lesson respected).
#
# 2026-10-29: no Telegram from CI. Red means overdue (or a broken sensor); the
# keeper's Mac sentinel turns one red series into one repairman incident.
on:
  schedule:
    - cron: '23 8 * * *'   # daily 08:23 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check days since last axis capture
        env:
          THRESHOLD_DAYS: '8'
        run: |
          set -euo pipefail
          newest_file=$(find data/observations -name 'deps_v2h1-*-manifest.json' -print0 2>/dev/null \
                          | xargs -0 -I{} sh -c 'echo "$(git log -1 --format=%ct -- "{}") {}"' \
                          | sort -n | tail -1 || true)
          if [ -z "$newest_file" ]; then echo "no captures found"; exit 1; fi
          ts=${newest_file%% *}
          days=$(( ( $(date +%s) - ts ) / 86400 ))
          latest="commit $(date -u -d @"$ts" +%F) (${newest_file#* })"
          echo "newest capture commit: $latest (${days}d ago)"
          if [ "$days" -gt "$THRESHOLD_DAYS" ]; then
            msg="⏰ Evidaxis: еженедельный сбор данных о зависимостях проектов не делался ${days} дн. — на сайте стареет одна из осей рейтинга."$'\n'"Что сделать: в любом чате скажи «продолжаем evidaxis»."
            # Red IS the alarm (29.10.2026): no Telegram from CI. The sentinel on the
            # keeper's Mac reads red runs and queues ONE incident per red series for the
            # repairman; the daily cron repeating a red run adds no new message.
            echo "::error title=Axis capture overdue::$msg"
            exit 1
          fi
