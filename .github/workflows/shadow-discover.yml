name: shadow-discover

# Monthly membership discovery for the private 200..499-star shadow layer.
# Each Search shard commits independently; the merge refuses a partial set.

on:
  schedule:
    - cron: "11 2 3 * *"   # Monthly on day 3 at 02:11 UTC
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: shadow-layer
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      month: ${{ steps.period.outputs.month }}
    steps:
      - id: period
        run: echo "month=$(date -u +%Y-%m)" >> "${GITHUB_OUTPUT}"

  discover:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Search's 30-request/minute budget is shared by this credential. One
      # in-flight shard preserves that budget and leaves at most one uncommitted.
      max-parallel: 1
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      EVIDAXIS_SHADOW_REPO: ${{ vars.EVIDAXIS_SHADOW_REPO }}
      DISCOVERY_MONTH: ${{ needs.prepare.outputs.month }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Verify and clone the private destination
        env:
          GH_TOKEN: ${{ secrets.SHADOW_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::SHADOW_REPO_TOKEN is missing"
            exit 1
          fi
          if [ -z "${EVIDAXIS_SHADOW_REPO}" ]; then
            echo "::error::Actions variable EVIDAXIS_SHADOW_REPO is missing"
            exit 1
          fi
          VISIBILITY=$(gh repo view "${EVIDAXIS_SHADOW_REPO}" --json visibility --jq .visibility)
          if [ "${VISIBILITY}" != "PRIVATE" ]; then
            echo "::error::EVIDAXIS_SHADOW_REPO must identify a private repository"
            exit 1
          fi
          SHADOW_WORKTREE="${RUNNER_TEMP}/shadow-repository"
          gh auth setup-git
          gh repo clone "${EVIDAXIS_SHADOW_REPO}" "${SHADOW_WORKTREE}"
          if [ -z "$(git -C "${SHADOW_WORKTREE}" branch --show-current)" ]; then
            echo "::error::private repository must have an initialized default branch"
            exit 1
          fi

      - name: Discover and push this shard
        env:
          GH_TOKEN: ${{ secrets.SHADOW_REPO_TOKEN }}
          SHARD_INDEX: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          SHADOW_WORKTREE="${RUNNER_TEMP}/shadow-repository"
          EVIDAXIS_SHADOW_REPO="${SHADOW_WORKTREE}" \
            python3 collectors/shadow_snapshot.py \
              --mode discover \
              --month "${DISCOVERY_MONTH}" \
              --shard "${SHARD_INDEX}/8"

          cd "${SHADOW_WORKTREE}"
          git config user.name "Evidaxis"
          git config user.email "git@evidaxis.org"
          git add -- "discovery/${DISCOVERY_MONTH}/shard-${SHARD_INDEX}.jsonl"
          if git diff --cached --quiet; then
            echo "discovery shard ${SHARD_INDEX}/8 already present"
            exit 0
          fi
          git commit -m "shadow: discovery ${DISCOVERY_MONTH} shard ${SHARD_INDEX}/8"
          BRANCH=$(git branch --show-current)
          for ATTEMPT in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            echo "push rejected; rebase and retry (${ATTEMPT}/3)"
            git pull --rebase origin "${BRANCH}"
          done
          echo "::error::private discovery shard push failed after 3 attempts"
          exit 1

  merge:
    needs: [prepare, discover]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EVIDAXIS_SHADOW_REPO: ${{ vars.EVIDAXIS_SHADOW_REPO }}
      DISCOVERY_MONTH: ${{ needs.prepare.outputs.month }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Verify and clone the private destination
        env:
          GH_TOKEN: ${{ secrets.SHADOW_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::SHADOW_REPO_TOKEN is missing"
            exit 1
          fi
          if [ -z "${EVIDAXIS_SHADOW_REPO}" ]; then
            echo "::error::Actions variable EVIDAXIS_SHADOW_REPO is missing"
            exit 1
          fi
          VISIBILITY=$(gh repo view "${EVIDAXIS_SHADOW_REPO}" --json visibility --jq .visibility)
          if [ "${VISIBILITY}" != "PRIVATE" ]; then
            echo "::error::EVIDAXIS_SHADOW_REPO must identify a private repository"
            exit 1
          fi
          SHADOW_WORKTREE="${RUNNER_TEMP}/shadow-repository"
          gh auth setup-git
          gh repo clone "${EVIDAXIS_SHADOW_REPO}" "${SHADOW_WORKTREE}"

      - name: Merge, verify, and push discovery
        env:
          GH_TOKEN: ${{ secrets.SHADOW_REPO_TOKEN }}
        run: |
          set -euo pipefail
          SHADOW_WORKTREE="${RUNNER_TEMP}/shadow-repository"
          EVIDAXIS_SHADOW_REPO="${SHADOW_WORKTREE}" \
            python3 collectors/shadow_snapshot.py \
              --mode discover \
              --month "${DISCOVERY_MONTH}" \
              --merge \
              --shards 8

          cd "${SHADOW_WORKTREE}"
          git config user.name "Evidaxis"
          git config user.email "git@evidaxis.org"
          git add -- \
            "discovery/${DISCOVERY_MONTH}/ids.jsonl" \
            "discovery/${DISCOVERY_MONTH}/ids.sha256"
          if git diff --cached --quiet; then
            echo "discovery ${DISCOVERY_MONTH} already merged and verified"
            exit 0
          fi
          git commit -m "shadow: merge discovery ${DISCOVERY_MONTH}"
          BRANCH=$(git branch --show-current)
          for ATTEMPT in 1 2 3; do
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            echo "push rejected; rebase and retry (${ATTEMPT}/3)"
            git pull --rebase origin "${BRANCH}"
          done
          echo "::error::private discovery merge push failed after 3 attempts"
          exit 1
