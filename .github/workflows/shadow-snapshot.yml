name: shadow-snapshot

# Non-public 200..499-star point-in-time observations. The public checkout only
# supplies collector code; every value-bearing artifact is written and pushed
# to the configured private repository. Any collection, validation, commit, or
# push error exits non-zero after preserving a resumable private checkpoint.
#
# Operator configuration in this public repository:
#   Actions variable EVIDAXIS_SHADOW_REPO = private repository as owner/name
#   Actions secret   SHADOW_REPO_TOKEN    = fine-grained token with Contents
#                                         read/write on that repository only

on:
  schedule:
    - cron: "43 5 * * 0"   # Sundays 05:43 UTC, weekly
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: shadow-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      EVIDAXIS_SHADOW_REPO: ${{ vars.EVIDAXIS_SHADOW_REPO }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - name: Verify and clone the private destination
        env:
          GH_TOKEN: ${{ secrets.SHADOW_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::SHADOW_REPO_TOKEN is missing"
            exit 1
          fi
          if [ -z "${EVIDAXIS_SHADOW_REPO}" ]; then
            echo "::error::Actions variable EVIDAXIS_SHADOW_REPO is missing"
            exit 1
          fi
          VISIBILITY=$(gh repo view "${EVIDAXIS_SHADOW_REPO}" --json visibility --jq .visibility)
          if [ "${VISIBILITY}" != "PRIVATE" ]; then
            echo "::error::EVIDAXIS_SHADOW_REPO must identify a private repository"
            exit 1
          fi
          SHADOW_WORKTREE="${RUNNER_TEMP}/shadow-repository"
          gh auth setup-git
          gh repo clone "${EVIDAXIS_SHADOW_REPO}" "${SHADOW_WORKTREE}"
          BRANCH=$(git -C "${SHADOW_WORKTREE}" branch --show-current)
          if [ -z "${BRANCH}" ]; then
            echo "::error::private repository must have an initialized default branch"
            exit 1
          fi

      - name: Collect, checkpoint, and push
        env:
          GH_TOKEN: ${{ secrets.SHADOW_REPO_TOKEN }}
        run: |
          set -uo pipefail
          set +e
          SHADOW_WORKTREE="${RUNNER_TEMP}/shadow-repository"
          SNAPSHOT_DATE=$(date -u +%Y-%m-%d)
          EVIDAXIS_SHADOW_REPO="${SHADOW_WORKTREE}" \
            python3 collectors/shadow_snapshot.py --date "${SNAPSHOT_DATE}"
          COLLECT_STATUS=$?

          set -e
          cd "${SHADOW_WORKTREE}"
          git config user.name "Evidaxis"
          git config user.email "git@evidaxis.org"
          git add -A
          if git diff --cached --quiet; then
            if [ "${COLLECT_STATUS}" -ne 0 ]; then
              echo "::error::collection failed and produced no resumable checkpoint"
              exit "${COLLECT_STATUS}"
            fi
            echo "snapshot ${SNAPSHOT_DATE} already present and verified; no commit needed"
          else
            if [ "${COLLECT_STATUS}" -eq 0 ]; then
              git commit -m "shadow: weekly star snapshot (${SNAPSHOT_DATE})"
            else
              git commit -m "shadow: resumable failed checkpoint (${SNAPSHOT_DATE})"
            fi
            BRANCH=$(git branch --show-current)
            PUSHED=0
            for ATTEMPT in 1 2 3; do
              if git push origin "HEAD:${BRANCH}"; then
                PUSHED=1
                break
              fi
              echo "push rejected; rebase and retry (${ATTEMPT}/3)"
              git pull --rebase origin "${BRANCH}"
            done
            if [ "${PUSHED}" -ne 1 ]; then
              echo "::error::private shadow push failed after 3 attempts"
              exit 1
            fi
          fi

          if [ "${COLLECT_STATUS}" -ne 0 ]; then
            echo "::error::shadow collection failed; checkpoint was preserved"
            exit "${COLLECT_STATUS}"
          fi
