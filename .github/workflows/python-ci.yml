name: python-ci

# Quality gate for the collector (etl/). Runs the public test suite with a coverage
# floor on every change to the ETL code, its tests, or the deposited genesis copy.
#
# Scope note: spine/ is gitignored (private future-v3 architecture), so it is NOT part
# of this public CI. The spine's proving-run-gate (spine/ci_gate.py) is a LOCAL
# discipline run before a mint, not a GitHub workflow. See AUDIT-BASELINE.md §CI.
# A red run is the signal. This file does not send a message.

on:
  # The automated producers push with the default GITHUB_TOKEN, and GitHub does
  # not start workflows for those commits, so a bot-written tree was never
  # gated: the 2026-08-08 snapshot broke the site build and this workflow only
  # went red on 2026-08-10, when a human pushed for unrelated reasons. Gates
  # must see the commits that were never reviewed by a person, first of all.
  workflow_run:
    workflows: ["weekly-snapshot", "t2-daily-snapshot"]
    types: [completed]
  # No path filter: test_license_coverage reads every tracked file. A filtered push
  # let new files outside REUSE.toml land green three times (web/.foundation-check
  # 2026-09-24, governance key files 2026-10-19, web/test-fixtures 2026-10-29), and
  # the gate went red only on the next bot snapshot, a day later.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0   # axis3 forward-count tests need first-add commit timestamps
          # workflow_run hands over the SHA the producer STARTED from, i.e. the
          # tree before the data it just committed; gating that proves nothing.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Guard changes to publication checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/gate_change_guard.py

      - name: Install dev/QA toolchain
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt

      - name: Unit tests + coverage floor (etl/ — public; spine/ excluded by design)
        run: >-
          python -m pytest tests/
          --cov=collect --cov=archive_pin --cov=indexnow --cov=reclass_pre_spine
          --cov=t2_collect --cov=t2_deps_collect
          --cov-report=term-missing --cov-fail-under=85

      - name: Lint (ruff — real-defect ruleset, non-style)
        run: ruff check etl tests collectors

      - name: Drift guard — deposited genesis code matches live etl/
        run: python -m pytest tests/test_genesis_deposit_sync.py -q
