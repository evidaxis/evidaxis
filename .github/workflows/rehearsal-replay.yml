name: rehearsal-replay
run-name: rehearsal replay ${{ inputs.drill || 'none' }} from ${{ inputs.source_run || 'latest' }}

# Replays the post-collection checks of one weekly rehearsal. The candidate comes
# from that run's artifact. A drill fault is injected only on this runner.
# This workflow does not publish. A failed automatic replay messages the keeper.
# A manual drill does not: the injected fault would page them.

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: "Run id of weekly-snapshot in rehearsal mode"
        required: true
        type: string
      drill:
        description: "One fault to inject on this runner only"
        required: false
        default: none
        type: choice
        options:
          - none
          - site_test
          - hf_handle
          - canary_missing
  push:
    branches: [main]
    paths:
      - "web/**"
      - "web/package.json"
      - "web/package-lock.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: rehearsal-replay
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    # Site verify of one collected candidate, without the weekly collection.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
          fetch-depth: 0   # candidate data is the rehearsal base commit plus the packed changes
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Choose the rehearsal candidate
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: python3 scripts/rehearsal_drill.py select

      - name: Download the rehearsal artifact
        if: ${{ success() && steps.source.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.source.outputs.run_id }}" --pattern 'snapshot-*' --dir "${{ runner.temp }}/replay-src"

      - name: Place the candidate snapshot
        if: ${{ success() && steps.source.outputs.found == 'true' }}
        run: |
          python3 scripts/rehearsal_drill.py place \
            --download "${{ runner.temp }}/replay-src" \
            --summary-dir "${{ runner.temp }}/evx-summary"

      - name: Inject one drill fault
        if: ${{ success() && steps.source.outputs.found == 'true' }}
        run: python3 scripts/rehearsal_drill.py apply --drill "${{ inputs.drill || 'none' }}" --date "$SNAPSHOT_DATE"

      - name: Check the HF publication projection
        id: hf
        if: ${{ success() && steps.source.outputs.found == 'true' }}
        continue-on-error: true
        run: python3 scripts/hf_upload_snapshot.py --date "$SNAPSHOT_DATE" --dry-run

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ success() && steps.source.outputs.found == 'true' }}
        with:
          node-version: "22"

      - name: Verify the site against this rehearsal candidate
        id: verify
        if: ${{ success() && steps.source.outputs.found == 'true' }}
        continue-on-error: true
        env:
          EVIDAXIS_DATA_DIR: ${{ github.workspace }}/data
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_CLARITY_ID: ${{ vars.PUBLIC_CLARITY_ID }}
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
        run: |
          cd web
          npm ci
          npm run verify

      - name: Rehearsal report
        id: report
        if: ${{ success() && steps.source.outputs.found == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OUT="${{ runner.temp }}/evx-summary"
          mkdir -p "$OUT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$OUT/jobs.json" || rm -f "$OUT/jobs.json"
          python3 scripts/rehearsal_report.py --date "$SNAPSHOT_DATE" --summary-dir "$OUT"

      - name: Drill verdict
        if: ${{ always() && steps.source.outputs.found == 'true' }}
        env:
          DRILL: ${{ inputs.drill || 'none' }}
          HF: ${{ steps.hf.outcome }}
          VERIFY: ${{ steps.verify.outcome }}
          REPORT: ${{ steps.report.outcome }}
        run: python3 scripts/rehearsal_drill.py verdict

      # An early failure skips the verify setup above. The keeper line still needs Node.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ failure() && github.event_name == 'push' }}
        with:
          node-version: "22"

      - name: Tell the keeper the automatic replay failed
        if: ${{ failure() && github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ALERT_CHAT_ID: ${{ secrets.ALERT_TG_CHAT_ID }}
        run: node scripts/ci-alert.mjs
