name: rehearsal-replay
run-name: rehearsal replay ${{ inputs.drill || 'none' }} from ${{ inputs.source_run || 'latest' }}

# Replays the post-collection checks of one weekly rehearsal. The candidate comes
# from that run's artifact. A drill fault is injected only on this runner.
# This workflow does not publish. A failed automatic replay stays red.
# This file does not send a message.

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: "Run id of weekly-snapshot in rehearsal mode"
        required: true
        type: string
      drill:
        description: "Fault or benign drift to inject on this runner only"
        required: false
        default: none
        type: choice
        options:
          - none
          - site_test
          - hf_handle
          - canary_missing
          - benign_all
  pull_request:
    paths:
      - "**/*.data.test.ts"
      - "web/**"
      - "scripts/**"
      - "collectors/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "web/package.json"
      - "web/package-lock.json"

permissions:
  contents: read
  actions: read

concurrency:
  # Push and manual replays stay serialized as before; each PR gets its own lane so a
  # PR matrix never waits behind, or cancels, another PR or the weekly replay.
  group: ${{ github.event_name == 'pull_request' && format('rehearsal-replay-pr-{0}', github.event.pull_request.number) || 'rehearsal-replay' }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        drill: ${{ fromJSON(github.event_name == 'pull_request' && '["none","benign_all","site_test","hf_handle","canary_missing"]' || format('["{0}"]', inputs.drill || 'none')) }}
    # Site verify of one collected candidate, without the weekly collection.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.sha }}
          fetch-depth: 0   # candidate data is the rehearsal base commit plus the packed changes
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Choose the rehearsal candidate
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.source_run }}
        run: python3 scripts/rehearsal_drill.py select

      - name: Download the rehearsal artifact
        if: ${{ success() && steps.source.outputs.found == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ steps.source.outputs.run_id }}" --pattern 'snapshot-*' --dir "${{ runner.temp }}/replay-src"

      - name: Place the candidate snapshot
        if: ${{ success() && steps.source.outputs.found == 'true' }}
        run: |
          python3 scripts/rehearsal_drill.py place \
            --download "${{ runner.temp }}/replay-src" \
            --summary-dir "${{ runner.temp }}/evx-summary"

      - name: Use main data when no complete candidate exists
        if: ${{ success() && steps.source.outputs.found == 'false' }}
        run: |
          # Exactly main's data: files the PR added under data/ or etl/ must not survive.
          rm -rf data etl
          git checkout origin/main -- data etl
          echo "SNAPSHOT_DATE=$(python3 -c 'import json; print(json.load(open("data/latest.json"))["snapshot_date"])')" >> "$GITHUB_ENV"

      - name: Apply the rehearsal drill
        id: apply
        if: ${{ success() }}
        run: python3 scripts/rehearsal_drill.py apply --drill "${{ matrix.drill }}" --date "$SNAPSHOT_DATE"

      - name: Check the HF publication projection
        id: hf
        if: ${{ success() }}
        # Keep raw diagnostics private for benign_all: a planted move can expose real
        # former owners. Other drills print the log as before. The verdict consumes
        # every outcome and fails on unexpected errors.
        env:
          DRILL: ${{ matrix.drill }}
        run: |
          if python3 scripts/hf_upload_snapshot.py --date "$SNAPSHOT_DATE" --dry-run \
              --stage-dir "$RUNNER_TEMP/replay-hf" > "$RUNNER_TEMP/replay-hf.log" 2>&1; then
            echo 'outcome=success' >> "$GITHUB_OUTPUT"
          else
            echo 'outcome=failure' >> "$GITHUB_OUTPUT"
          fi
          if [ "$DRILL" != benign_all ]; then cat "$RUNNER_TEMP/replay-hf.log"; fi

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ success() }}
        with:
          node-version: "22"

      - name: Verify the site against this rehearsal candidate
        id: verify
        if: ${{ success() }}
        env:
          EVIDAXIS_DATA_DIR: ${{ github.workspace }}/data
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_CLARITY_ID: ${{ vars.PUBLIC_CLARITY_ID }}
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
          DRILL: ${{ matrix.drill }}
        run: |
          cd web
          if (npm ci && npm run verify) > "$RUNNER_TEMP/replay-verify.log" 2>&1; then
            echo 'outcome=success' >> "$GITHUB_OUTPUT"
          else
            echo 'outcome=failure' >> "$GITHUB_OUTPUT"
          fi
          if [ "$DRILL" != benign_all ]; then cat "$RUNNER_TEMP/replay-verify.log"; fi

      - name: Probation data tests on PRs
        # Blocks the PR but stays out of the drill verdict: only production verify may
        # count as a caught drill (a probation test must not stand in for a real gate).
        # Runs only on a candidate that should be valid (no drill, or benign drift) and
        # verified: leak drills break data on purpose, so probation results there say nothing.
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.verify.outputs.outcome == 'success' && (matrix.drill == 'none' || matrix.drill == 'benign_all') }}
        run: cd web && npm run test:probation

      - name: Independent benign-drift oracle
        id: oracle
        if: ${{ always() && matrix.drill == 'benign_all' && steps.apply.outcome == 'success' }}
        env:
          BENIGN_MANIFEST: ${{ steps.apply.outputs.manifest }}
        run: |
          python3 scripts/rehearsal_drill.py oracle --manifest "$BENIGN_MANIFEST" \
            --dist web/dist --hf "$RUNNER_TEMP/replay-hf"

      - name: Rehearsal report
        id: report
        if: ${{ always() && steps.apply.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ steps.source.outputs.found }}" = false ]; then
            echo 'outcome=success' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          OUT="${{ runner.temp }}/evx-summary"
          mkdir -p "$OUT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100" > "$OUT/jobs.json" || rm -f "$OUT/jobs.json"
          if python3 scripts/rehearsal_report.py --date "$SNAPSHOT_DATE" --summary-dir "$OUT"; then
            echo 'outcome=success' >> "$GITHUB_OUTPUT"
          else
            echo 'outcome=failure' >> "$GITHUB_OUTPUT"
          fi

      - name: Drill verdict
        if: ${{ always() }}
        env:
          DRILL: ${{ matrix.drill }}
          HF: ${{ steps.hf.outputs.outcome || steps.hf.outcome }}
          VERIFY: ${{ steps.verify.outputs.outcome || steps.verify.outcome }}
          REPORT: ${{ steps.report.outputs.outcome || steps.report.outcome }}
          ORACLE: ${{ steps.oracle.outcome }}
        run: python3 scripts/rehearsal_drill.py verdict
