name: Registry tranche staleness check
# Fail-safe sensor for the weekly card-activation tranche («пополнение индекса»).
# Twin of axis-staleness-check (keeper request 2026-07-21: "I will forget — wire it
# into rituals"; extended 2026-08-18 after the third tranche slipped a day: the
# ritual captured the axis but no chat owned the tranche). Pure git-based fact
# sensor: if the newest committed tranche file is older than the threshold, the run
# goes red. SILENT while the weekly tranche lands on time — dead-week alarm, not a
# notification channel.
#
# 2026-10-29: no Telegram from CI. Red means overdue (or a broken sensor); the
# keeper's Mac sentinel turns one red series into one repairman incident.
on:
  schedule:
    - cron: '41 8 * * *'   # daily 08:41 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check days since last activation tranche
        env:
          THRESHOLD_DAYS: '8'
        run: |
          set -euo pipefail
          newest_file=$(find data/census -path '*/tranches/*-tranche.json' -print0 2>/dev/null \
                          | xargs -0 -I{} sh -c 'echo "$(git log -1 --format=%ct -- "{}") {}"' \
                          | sort -n | tail -1 || true)
          if [ -z "$newest_file" ]; then echo "no tranches found"; exit 1; fi
          # 2026-09-28: the capacity-bounded tranche of 2026-09-20 drained the queue
          # (5,705 of 5,705). With nothing left to activate, a quiet week is not a
          # missed tranche. Stay silent while the newest census holds fewer pending
          # members than the policy floor (10 per tranche, REGISTRY-GROWTH-POLICY);
          # the next monthly census refills the queue and the age check resumes.
          newest_manifest=$(ls data/census/20*/pending-manifest.json 2>/dev/null | sort | tail -1 || true)
          if [ -n "$newest_manifest" ]; then
            pending=$(python3 -c 'import json,sys; m=json.load(open(sys.argv[1])); print(sum(1 for x in m["members"] if x.get("status") == "pending"))' "$newest_manifest")
            echo "pending in ${newest_manifest}: ${pending}"
            if [ "$pending" -lt 10 ]; then
              echo "::notice title=Queue drained::${pending} pending (<10, policy floor) - nothing to activate until the next census"
              exit 0
            fi
          fi
          ts=${newest_file%% *}
          days=$(( ( $(date +%s) - ts ) / 86400 ))
          latest="commit $(date -u -d @"$ts" +%F) (${newest_file#* })"
          echo "newest tranche commit: $latest (${days}d ago)"
          if [ "$days" -gt "$THRESHOLD_DAYS" ]; then
            msg="⏰ Evidaxis: новые проекты в каталог не добавлялись ${days} дн. (обычно — раз в неделю)."$'\n'"Что сделать: в любом чате скажи «продолжаем evidaxis, пополнение индекса»."
            # Red IS the alarm (29.10.2026): no Telegram from CI. The sentinel on the
            # keeper's Mac reads red runs and queues ONE incident per red series for the
            # repairman; the daily cron repeating a red run adds no new message.
            echo "::error title=Tranche overdue::$msg"
            exit 1
          fi
